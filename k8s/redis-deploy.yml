apiVersion: v1
kind: Pod
metadata:
  name: redis-pod
  labels:
    name: redis-pod
    app: webapp
spec:
  containers:
    - name: redis
      image: redis:alpine
      ports:
      - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    name: redis-service
    app: webapp
spec:
  selector:
    name: redis-pod
    app: webapp
  ports:
    - port: 6379
      targetPort: 6379