apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: nhan2102/lms:latest
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "123"
            - name: MYSQL_PASSWORD
              value: "admin"
            - name: MYSQL_DATABASE
              value: "mariadb"
          ports:
            - containerPort: 8000
            - containerPort: 9000
          imagePullPolicy: Always
          volumeMounts:
            - name: frappe-storage
              mountPath: /home/frappe
      volumes:
        - name: frappe-storage
          persistentVolumeClaim:
            claimName: frappe-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  labels:
    app: webapp
spec:
  type: LoadBalancer
  selector:
    app: webapp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: http-alt
      port: 9000
      targetPort: 9000
